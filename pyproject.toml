[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pfc3w"
version = "0.1.0"
description = "Validação fisicamente independente e pré-processamento causal no 3W Dataset"
requires-python = ">=3.11,<3.13"
dependencies = [
  "joblib>=1.4",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "seaborn>=0.13",
  "shap>=0.46",
  "xgboost>=2.1",
]

[dependency-groups]
dev = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pfc3w"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
